name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      # Each gate runs even when an earlier one failed, so one red check never
      # hides the others — a lint failure used to leave tests unrun. All three
      # still need a successful install.
      - run: pnpm lint

      - run: pnpm typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

      - run: pnpm test
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}

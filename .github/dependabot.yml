version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    target-branch: updates/dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "09:00"
      timezone: America/New_York
    target-branch: updates/dependencies
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    ignore:
      # jsdom 30.1 hides its wrapper->impl link in private fields, which breaks vitest's
      # jsdom Blob/FormData shim for fetch bodies (every upload test throws). Drop this once
      # a vitest release reads jsdom 30.1 Blobs.
      - dependency-name: jsdom
        versions: [">=30.1.0"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
